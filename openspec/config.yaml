# openspec/config.yaml — MELI Manager
schema: spec-driven

context: |
  Flask 3.1 web app for MercadoLibre marketplace management (multi-cuenta + OAuth).
  Python 3.14, SQLite via sqlite3 stdlib, requests for API calls.
  Architecture: bare Flask (no blueprints), raw SQL (no ORM), no service layer.
  Templates: Jinja2 with Bootstrap-like styled base template.
  Convention: Spanish UI strings, docstrings in Spanish, mixed ES/EN identifiers.

rules:
  strict_tdd: false
  testing:
    runner: none
    unit: false
    integration: false
    e2e: false
    coverage: false
    linter: none
    type_checker: none
    formatter: none

  proposal:
    - One change per proposal
    - Include affected modules (app.py, database.py, meli_client.py, calculator.py)

  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)

  design:
    - Include data flow for routes that interact with MELI API
    - Document SQL schema changes with migration notes

  tasks:
    - Group by module, use hierarchical numbering
    - Keep tasks completable in one session

  apply:
    - Follow existing patterns: raw SQL, no ORM, no blueprints
    tdd: false
    test_command: ""

  verify:
    test_command: ""
    build_command: "python app.py"
    coverage_threshold: 0

  archive:
    - Warn before merging destructive deltas
